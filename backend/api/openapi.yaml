openapi: 3.0.3
    | `method_not_allowed` | 405 | у этого пути нет такого метода |
info:
  title: studyvault API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    REST API базы знаний студента: заметки со ссылками `[[Название]]`, предметы, теги, поиск и файлы.

    **Авторизация.** `POST /auth/register` и `POST /auth/login` возвращают `access_token` (живёт 15 минут).
    Его передают в заголовке `Authorization: Bearer <токен>`. Refresh-токен приходит в httpOnly cookie
    `refresh_token`, а `POST /auth/refresh` меняет его на новую пару.

    **Ошибки.** Формат RFC 7807 (`Content-Type: application/problem+json`), всегда один и тот же:
    `{"type": "...", "title": "Not Found", "status": 404, "detail": "...", "code": "not_found", "request_id": "..."}`.
    Клиент ориентируется на `code`: он стабилен. `detail` написан для человека, `type` ведёт на описание кода в
    [docs/errors.md](https://github.com/whoaskedssselery/studyvault/blob/main/docs/errors.md), `request_id`
    совпадает с заголовком `X-Request-ID` и нужен, чтобы найти запрос в логе сервера. Чужие и несуществующие
    объекты неотличимы: оба дают `not_found`.

    | code | HTTP | Когда |
    |---|---|---|
    | `validation_failed` | 400 | неверные входные данные, неизвестное поле, неправильный id или курсор |
    | `unauthorized` | 401 | нет токена, он неверный или просрочен |
    | `invalid_credentials` | 401, 403 | неверная почта или пароль (401); неверный текущий пароль при смене (403) |
    | `invalid_token` | 401 | refresh-токен отсутствует, просрочен или уже использован |
    | `not_found` | 404 | объект не найден (или принадлежит другому пользователю) |
    | `email_taken` | 409 | почта уже зарегистрирована |
    | `tag_exists` | 409 | у пользователя уже есть тег с таким именем |
    | `limit_reached` | 409 | исчерпана квота пользователя, см. «Лимиты» |
    | `not_uploaded` | 409 | файл зарегистрирован, но ещё не загружен |
    | `rate_limited` | 429 | слишком много попыток входа; заголовок `Retry-After` в секундах |
    | `internal` | 500 | непредвиденная ошибка сервера (подробности только в его логе) |
    | `search_unavailable` | 503 | поиск недоступен, остальное API работает |
    | `storage_unavailable` | 503 | хранилище файлов недоступно, остальное API работает |

    **Лимиты.** Вход, регистрация, обновление токена и смена пароля: 20 попыток в минуту с одного адреса, дальше 429.
    Квоты на пользователя: 200 предметов, 500 тегов, 50 файлов на заметку, 5000 файлов и 1 ГиБ суммарно (один файл до
    20 МБ), дальше 409 `limit_reached`. Квоты мягкие: при одновременных запросах предел можно превысить на число
    параллельных запросов.

    **Страницы.** Список заметок отдаётся страницами по курсору: `next_cursor` из ответа передают в `?cursor=`,
    `null` значит, что страница последняя. Остальные списки ограничены квотами (см. «Лимиты») и приходят целиком.

    **Версии.** Версия указана в пути: все эндпоинты живут под `/v1` (пути в этой документации даны относительно
    него). Совместимые изменения (новые поля и эндпоинты) выходят без смены версии. Несовместимые выйдут под
    `/v2`, а `/v1` какое-то время продолжит работать. Проба живости `GET /health` есть и без префикса: она для
    оркестратора и не привязана к версии. Refresh-cookie выдаётся с путём `/v1/auth`.

servers:
  - url: /v1
    description: версия 1 на том же адресе, с которого открыта документация

tags:
  - name: auth
    description: Регистрация, вход и токены
  - name: account
    description: Профиль и пароль текущего пользователя
  - name: subjects
    description: Предметы студента
  - name: notes
    description: Заметки, ссылки между ними и граф связей
  - name: tags
    description: Теги заметок
  - name: search
    description: Полнотекстовый поиск
  - name: attachments
    description: Файлы к заметкам

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Проверка живости сервиса и БД
      security: []
      responses:
        "200":
          description: Всё работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: БД недоступна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Регистрация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Создан. Refresh-токен приходит в httpOnly cookie `refresh_token`.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешный вход. Refresh-токен приходит в httpOnly cookie `refresh_token`.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Обновить access-токен
      description: |
        Читает cookie `refresh_token`, выдаёт новый access-токен и новый refresh-токен (ротация).
        Старый refresh-токен после этого недействителен.
      security: []
      responses:
        "200":
          description: Новая пара токенов
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход (отзывает refresh-токен)
      security: []
      responses:
        "204":
          description: Готово. Cookie `refresh_token` сбрасывается.

  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: Мой аккаунт
      responses:
        "200":
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [account]
      operationId: updateMe
      summary: Изменить имя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatch"
      responses:
        "200":
          description: Обновлённый аккаунт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me/password:
    post:
      tags: [account]
      operationId: changePassword
      summary: Сменить пароль
      description: |
        Проверяет текущий пароль и сохраняет новый. Все сессии пользователя на других устройствах
        завершаются, а этому клиенту выдаются новый access-токен и новый refresh-токен (cookie).
        Неверный текущий пароль даёт 403 `invalid_credentials`, а не 401, чтобы клиент не принял его
        за просроченный access-токен и не пытался обновить сессию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Пароль сменён
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/WrongPassword"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /subjects:
    get:
      tags: [subjects]
      operationId: listSubjects
      summary: Предметы пользователя
      responses:
        "200":
          description: Список предметов
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subject"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [subjects]
      operationId: createSubject
      summary: Создать предмет
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectInput"
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /subjects/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [subjects]
      operationId: updateSubject
      summary: Изменить предмет
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubjectPatch"
      responses:
        "200":
          description: Обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [subjects]
      operationId: deleteSubject
      summary: Удалить предмет
      description: Заметки предмета остаются, у них `subject_id` становится `null`.
      responses:
        "204":
          description: Удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Список заметок (без содержимого)
      description: Сортировка по `updated_at` от новых к старым. Удалённые заметки не возвращаются.
      parameters:
        - name: subject_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          description: Имя тега
          schema:
            type: string
        - name: pinned
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Страница заметок
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [notes]
      operationId: createNote
      summary: Создать заметку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [notes]
      operationId: getNote
      summary: Заметка целиком
      responses:
        "200":
          description: Заметка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [notes]
      operationId: updateNote
      summary: Изменить заметку
      description: |
        Меняет только переданные поля. При изменении `content` бэкенд пересобирает
        `content_text`, связи `[[...]]` и поисковый индекс.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotePatch"
      responses:
        "200":
          description: Обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: Удалить заметку (мягко, `deleted_at`)
      responses:
        "204":
          description: Удалена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notes/{id}/tags:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: [notes]
      operationId: setNoteTags
      summary: Заменить набор тегов заметки целиком
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_ids]
              properties:
                tag_ids:
                  type: array
                  maxItems: 50
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Заметка с новым набором тегов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /notes/{id}/backlinks:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [notes]
      operationId: listBacklinks
      summary: Заметки, которые ссылаются на эту через `[[...]]`
      responses:
        "200":
          description: Список обратных ссылок
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NoteSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /graph:
    get:
      tags: [notes]
      operationId: getGraph
      summary: Граф связей между заметками
      responses:
        "200":
          description: Узлы и рёбра
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Graph"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tags:
    get:
      tags: [tags]
      operationId: listTags
      summary: Теги пользователя
      responses:
        "200":
          description: Список тегов
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [tags]
      operationId: createTag
      summary: Создать тег
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /tags/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      tags: [tags]
      operationId: deleteTag
      summary: Удалить тег (снимается со всех заметок)
      responses:
        "204":
          description: Удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /search:
    get:
      tags: [search]
      operationId: searchNotes
      summary: Полнотекстовый поиск по заметкам (Meilisearch)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: subject_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          description: Имя тега
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Результаты, лучшие первыми
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /attachments:
    get:
      tags: [attachments]
      operationId: listAttachments
      summary: Файлы заметки
      parameters:
        - name: note_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Список файлов
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [attachments]
      operationId: createAttachment
      summary: Зарегистрировать файл и получить ссылку для загрузки
      description: |
        Создаёт запись и возвращает presigned PUT URL (действует 15 минут). Клиент загружает байты
        напрямую в хранилище запросом `PUT` на этот адрес, **не передавая токен**, и обязан отправить
        ровно те `Content-Type` (`mime_type`) и `Content-Length` (`size_bytes`), которые заявил здесь:
        они входят в подпись ссылки, и при любом расхождении хранилище ответит 403.
        Разрешены PDF, PNG, JPEG, WebP, GIF, обычный текст и Markdown, до 20 МБ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentInput"
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUpload"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: Метаданные файла и временная ссылка для скачивания
      description: Ссылка действует 15 минут, файл по ней скачивается как вложение.
      responses:
        "200":
          description: Файл
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentDownload"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: Удалить запись и объект в S3
      responses:
        "204":
          description: Удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен (живёт 15 минут).

  headers:
    RefreshCookie:
      description: "`refresh_token=<value>; HttpOnly; SameSite=Lax; Path=/auth`"
      schema:
        type: string

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    Cursor:
      name: cursor
      in: query
      description: Непрозрачная строка из `next_cursor` предыдущей страницы
      schema:
        type: string

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Нет или просрочен токен
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    WrongPassword:
      description: Неверный текущий пароль (`invalid_credentials`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Не найдено (или принадлежит другому пользователю)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Поиск или хранилище файлов временно недоступны (остальное API работает)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Слишком много попыток входа, регистрации, обновления токена или смены пароля с этого адреса
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Конфликт, дубликат (`tag_exists`, `email_taken`), файл ещё не загружен (`not_uploaded`) или исчерпана квота (`limit_reached`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: Описание ошибки по RFC 7807 с расширениями `code` и `request_id`
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          format: uri
          description: Адрес описания этого вида ошибки
          example: https://github.com/whoaskedssselery/studyvault/blob/main/docs/errors.md#not_found
        title:
          type: string
          description: Краткое название по HTTP-статусу
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          description: Объяснение для человека
          example: note not found
        code:
          type: string
          description: Стабильный машиночитаемый код, например `validation_failed` или `not_found`
          example: not_found
        request_id:
          type: string
          description: Совпадает с заголовком `X-Request-ID` ответа
          example: 3f9a1c2b7d4e5a60

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]

    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email:
          example: anna@example.com
          type: string
          format: email
          maxLength: 254
        password:
          example: correct-horse-battery
          type: string
          minLength: 8
          maxLength: 72
          description: Не длиннее 72 байт (ограничение bcrypt)
        display_name:
          example: Анна Студентова
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          example: anna@example.com
          type: string
          format: email
        password:
          example: correct-horse-battery
          type: string

    ProfilePatch:
      type: object
      required: [display_name]
      properties:
        display_name:
          example: Анна Студентова
          type: string
          minLength: 1
          maxLength: 100

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          example: correct-horse-battery
          type: string
        new_password:
          example: another-long-passphrase
          type: string
          minLength: 8
          maxLength: 72
          description: Не длиннее 72 байт (ограничение bcrypt) и не совпадает с текущим

    TokenResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Секунд до истечения access-токена
          example: 900

    AuthResponse:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          example: 900
        user:
          $ref: "#/components/schemas/User"

    Subject:
      type: object
      required: [id, title, color, semester, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        color:
          type: string
          nullable: true
          description: Hex для UI
          example: "#4f46e5"
        semester:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time

    SubjectInput:
      type: object
      required: [title]
      properties:
        title:
          example: Математический анализ
          type: string
          minLength: 1
          maxLength: 200
        color:
          example: "#4f46e5"
          type: string
          nullable: true
          pattern: "^#[0-9a-fA-F]{6}$"
        semester:
          example: 2
          type: integer
          nullable: true
          minimum: 1
          maximum: 12

    SubjectPatch:
      type: object
      minProperties: 1
      properties:
        title:
          example: Математический анализ
          type: string
          minLength: 1
          maxLength: 200
        color:
          example: "#4f46e5"
          type: string
          nullable: true
          pattern: "^#[0-9a-fA-F]{6}$"
        semester:
          example: 2
          type: integer
          nullable: true
          minimum: 1
          maximum: 12

    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    TagInput:
      type: object
      required: [name]
      properties:
        name:
          example: экзамен
          type: string
          minLength: 1
          maxLength: 50

    TiptapDoc:
      type: object
      description: Документ редактора Tiptap (ProseMirror JSON). Бэкенд хранит как есть.
      additionalProperties: true
      example:
        type: doc
        content:
          - type: paragraph
            content:
              - type: text
                text: Привет, [[Другая заметка]]

    NoteSummary:
      type: object
      required: [id, subject_id, title, is_pinned, tags, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        subject_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        is_pinned:
          type: boolean
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Note:
      allOf:
        - $ref: "#/components/schemas/NoteSummary"
        - type: object
          required: [content]
          properties:
            content:
              $ref: "#/components/schemas/TiptapDoc"

    NotePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NoteSummary"
        next_cursor:
          type: string
          nullable: true
          description: "`null`, если страница последняя"

    NoteInput:
      type: object
      required: [title, content]
      properties:
        title:
          example: Пределы функций
          type: string
          minLength: 1
          maxLength: 300
        content:
          $ref: "#/components/schemas/TiptapDoc"
        subject_id:
          type: string
          format: uuid
          nullable: true
        is_pinned:
          example: false
          type: boolean
          default: false

    NotePatch:
      type: object
      minProperties: 1
      properties:
        title:
          example: Пределы функций (конспект)
          type: string
          minLength: 1
          maxLength: 300
        content:
          $ref: "#/components/schemas/TiptapDoc"
        subject_id:
          type: string
          format: uuid
          nullable: true
        is_pinned:
          example: true
          type: boolean

    Graph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
        edges:
          type: array
          items:
            type: object
            required: [source, target]
            properties:
              source:
                type: string
                format: uuid
                description: Заметка, где написано `[[...]]`
              target:
                type: string
                format: uuid
                description: Заметка, на которую ссылаются

    SearchHit:
      type: object
      required: [id, title, snippet, subject_id, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        snippet:
          type: string
          description: |
            HTML-фрагмент текста вокруг совпадения. Весь текст заметки экранирован, а найденные
            слова обёрнуты в `<mark>`, поэтому фрагмент можно безопасно вставлять как HTML.
        subject_id:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time

    Attachment:
      type: object
      required: [id, note_id, file_name, mime_type, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        note_id:
          type: string
          format: uuid
          nullable: true
        file_name:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time

    AttachmentInput:
      type: object
      required: [file_name, mime_type, size_bytes]
      properties:
        note_id:
          type: string
          format: uuid
          nullable: true
        file_name:
          example: Лекция 1.pdf
          type: string
          minLength: 1
          maxLength: 255
        mime_type:
          example: application/pdf
          type: string
          enum:
            - application/pdf
            - image/png
            - image/jpeg
            - image/webp
            - image/gif
            - text/plain
            - text/markdown
        size_bytes:
          example: 183204
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
          description: До 20 МБ

    AttachmentUpload:
      type: object
      required: [attachment, upload_url]
      properties:
        attachment:
          $ref: "#/components/schemas/Attachment"
        upload_url:
          type: string
          format: uri
          description: Presigned PUT URL

    AttachmentDownload:
      type: object
      required: [attachment, download_url]
      properties:
        attachment:
          $ref: "#/components/schemas/Attachment"
        download_url:
          type: string
          format: uri
          description: Presigned GET URL
