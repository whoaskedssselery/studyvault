services:
  frontend:
    profiles: ["web"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5440:5432" # только с этой машины; 5432 и 5433 обычно заняты локальными Postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data

  # S3-совместимое хранилище. Образов MinIO на Docker Hub больше нет,
  # а клиент minio-go работает с любым S3.
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      # Browser uploads use signed S3 URLs directly, so the API proxy cannot supply these headers.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${S3_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4174,http://127.0.0.1:4174,http://localhost:5175,http://127.0.0.1:5175}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3_data:/data

  # Локальный почтовый ящик: письма со ссылкой сброса пароля приходят сюда, а не в интернет.
  # Окно со всеми письмами: http://localhost:8025. В боевом стенде вместо него настоящий SMTP (deploy/docker-compose.prod.yml).
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # Само приложение. Запускается только с профилем: docker compose --profile app up --build
  # Без профиля поднимается одна инфраструктура, а API гоняют локально (go run ./cmd/api).
  migrate:
    profiles: ["app"]
    build: ./backend
    image: studyvault-api:local
    entrypoint: ["/goose"]
    command: ["up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: ./backend
    image: studyvault-api:local
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      S3_ENDPOINT: s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-attachments}
      # Ссылки на загрузку и скачивание открывает браузер на хосте, а не контейнер.
      S3_PUBLIC_ENDPOINT: localhost:9000
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Локальный запуск идёт по http, поэтому Secure выключен. В проде оставьте true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-studyvault@example.com}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      EMAIL_VERIFY_URL: ${EMAIL_VERIFY_URL:-}
      # Для служебных команд (seed, promote), запускаемых в этом же контейнере.
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-20}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started
      s3:
        condition: service_started
      mailpit:
        condition: service_started
        required: false # в боевом стенде вместо него настоящий SMTP

volumes:
  postgres_data:
  meili_data:
  s3_data:
