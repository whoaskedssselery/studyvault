name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "scripts/**", "docker-compose.yml", ".env.example", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "scripts/**", "docker-compose.yml", ".env.example", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Тесты идут на настоящих сервисах, как и на машине разработчика.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: studyvault
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: studyvault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studyvault -d studyvault"
          --health-interval 5s --health-timeout 3s --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci-master-key-123456
        ports: ["7700:7700"]
      s3:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: ci-access
          RUSTFS_SECRET_KEY: ci-secret-key
        ports: ["9000:9000"]

    env:
      DATABASE_URL: postgres://studyvault:ci-password@localhost:5432/studyvault?sslmode=disable
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-1234
      MEILI_URL: http://localhost:7700
      MEILI_MASTER_KEY: ci-master-key-123456
      S3_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: ci-access
      S3_SECRET_KEY: ci-secret-key
      S3_BUCKET: attachments

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      # Сгенерированный код должен совпадать с исходниками: контракт OpenAPI и SQL-запросы.
      - name: Generated code is up to date
        run: |
          go generate ./internal/httpapi/
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc generate
          git diff --exit-code -- . || { echo "::error::generated code is stale: run go generate and sqlc generate"; exit 1; }

      - name: Wait for the services
        run: |
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS http://localhost:7700/health
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 1; done

      - name: Apply migrations
        run: go tool goose -dir migrations postgres "$DATABASE_URL" up

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # Падает, если в зависимостях или стандартной библиотеке есть уязвимость, которую код действительно вызывает.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Tests
        shell: bash
        run: go test -race -count=1 -coverprofile=coverage.out -v ./... 2>&1 | tee test.log

      # Тесты, которым не хватило базы или другого сервиса, пропускаются молча, и зелёный прогон ничего не доказывает.
      # В CI все сервисы подняты, поэтому любой пропуск означает поломку окружения.
      - name: No test was skipped
        run: |
          if grep -E '^\s*--- SKIP' test.log; then
            echo "::error::tests were skipped: a service the tests need is not reachable"
            exit 1
          fi

      # Сгенерированный код (sqlc, oapi-codegen) и точки входа не считаются: в них нет логики, написанной вручную.
      - name: Coverage of the hand-written code
        run: |
          grep -v -E '\.gen\.go|internal/db/(db|models|querier)\.go|\.sql\.go|/cmd/' coverage.out > hand.out
          total=$(go tool cover -func=hand.out | awk '/^total:/ {print $3}')
          echo "Coverage of the hand-written code: $total" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="${total%\%}" 'BEGIN { exit (t + 0 < 85) }' || { echo "::error::coverage $total is below 85%"; exit 1; }

      - name: Build
        run: go build ./...

  # То же, что делает человек по README: собрать образ, поднять весь стек одной командой и пройти основной путь
  # пользователя через настоящий HTTP. Ловит поломки, которых не видно юнит-тестам: Dockerfile, миграции в контейнере,
  # переменные окружения compose, ссылки на загрузку файлов.
  stack:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose --profile app up -d --build

      - name: Wait for the API
        run: curl --retry 60 --retry-connrefused --retry-delay 1 -fsS http://localhost:8080/health

      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080

      - name: Logs of the stack
        if: failure()
        run: docker compose --profile app logs --no-color
