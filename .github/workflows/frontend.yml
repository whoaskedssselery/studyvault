name: frontend
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'deliverables/frontend/**', 'backend/api/openapi.yaml', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'deliverables/frontend/**', 'backend/api/openapi.yaml', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run package:submission
      - run: npm run test:proxy
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-checks-and-submission
          path: |
            frontend/test-results/
            docs/assignment-2/
            deliverables/frontend/
